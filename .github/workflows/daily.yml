name: daily-build

on:
  schedule:
    - cron: "10 7 * * 1-5"   # 평일 16:10 KST (UTC 07:10)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: 데이터 갱신
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/update_data.py

      - name: 데이터 커밋
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add docs/data.json docs/history.json
          git diff --cached --quiet || git commit -m "data: 일일 갱신"
          git push

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: 웹 화면과 데이터를 APK 안에 넣기
        run: |
          mkdir -p android/app/src/main/assets/web
          cp docs/index.html docs/sw.js docs/manifest.json docs/icon.svg docs/data.json android/app/src/main/assets/web/

      - name: APK 빌드
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: APK 릴리스 게시
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest -y --cleanup-tag 2>/dev/null || true
          gh release create latest android/app/build/outputs/apk/release/app-release.apk \
            --title "주식분석 APK ($(date +%Y-%m-%d))" \
            --notes "매일 장 마감 후 자동 빌드된 최신 APK입니다. 휴대폰에서 파일을 받아 설치하세요."
