plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.stockapp'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.stockapp'
        minSdk 24
        targetSdk 34
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName '1.0'
    }

    // 업데이트 설치가 되도록 항상 같은 키로 서명한다 (개인용 키, 저장소에 포함됨)
    signingConfigs {
        release {
            storeFile file('stock-release.keystore')
            storePassword 'stockapp'
            keyAlias 'stockapp'
            keyPassword 'stockapp'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.8.0'
}
